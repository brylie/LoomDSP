[package]
name = "loom-app"
description = "The LoomDSP desktop app: patch canvas, inspector, and live audio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["audio", "synthesizer", "modular", "live", "dsp"]
categories = ["multimedia::audio", "gui"]

[[bin]]
name = "loom-app"
path = "src/main.rs"

[dependencies]
loom-core.workspace = true
# `test-modules`: the `test.` modules, for --test-modules and the app's tests.
loom-modules = { workspace = true, features = ["test-modules"] }
loom-patch.workspace = true
loom-host-desktop.workspace = true
loom-canvas.workspace = true
iced_wgpu.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
iced = { workspace = true, features = ["smol", "markdown"] }
clap.workspace = true
rfd.workspace = true
ron.workspace = true
etcetera.workspace = true
jiff.workspace = true
# Runs widget operations on the live window, for the control channel.
iced_runtime.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
hound.workspace = true
loom-analysis.workspace = true

[lints]
workspace = true
