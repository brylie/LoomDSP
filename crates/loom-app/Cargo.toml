[package]
name = "loom-app"
description = "The LoomDSP desktop app: patch canvas, inspector, and live audio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["audio", "synthesizer", "modular", "live", "dsp"]
categories = ["multimedia::audio", "gui"]

[lib]
name = "loom_app"
path = "src/lib.rs"

# `doc` is off because the library has the same name, and `test` because the
# program is one call into the library, whose tests cover it.
[[bin]]
name = "loom-app"
path = "src/bin/loom-app.rs"
doc = false
test = false

[features]
# The headless `Ui` harness, for the tests in `tests/`. It changes no behaviour.
test-ui = []

[dependencies]
loom-core.workspace = true
# `test-modules`: the `test.` modules, for --test-modules and the app's tests.
loom-modules = { workspace = true, features = ["test-modules"] }
loom-patch.workspace = true
loom-host-desktop.workspace = true
loom-canvas.workspace = true
loom-ui-core.workspace = true
iced_wgpu.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
iced = { workspace = true, features = ["smol", "markdown"] }
clap.workspace = true
rfd.workspace = true
ron.workspace = true
etcetera.workspace = true
jiff.workspace = true
# Runs widget operations on the live window, for the control channel.
iced_runtime.workspace = true
# The spectrum display. On the telemetry thread only, never in the engine crates.
rustfft.workspace = true
# The accessibility tree for screen readers (ADR-0041). Built and tested on
# every platform; `a11y/macos.rs` attaches it to the window.
accesskit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Attaches the accessibility tree to the window Iced made, until our own
# shell does it on every platform (docs/dev/leaving-iced-plan.md, phase 2).
accesskit_macos = "0.27"

[target.'cfg(windows)'.dependencies]
# Where Documents really is: OneDrive or the user can move it (#556).
known-folders = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
hound.workspace = true
loom-analysis.workspace = true
# `test-ui`: lets the tests in `tests/` import `Ui`.
loom-app = { path = ".", features = ["test-ui"] }

[lints]
workspace = true
