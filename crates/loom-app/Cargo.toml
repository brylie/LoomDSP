[package]
name = "loom-app"
description = "The LoomDSP desktop app: patch canvas, inspector, and live audio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["audio", "synthesizer", "modular", "live", "dsp"]
categories = ["multimedia::audio", "gui"]

[lib]
name = "loom_app"
path = "src/lib.rs"

# `doc` is off because the library has the same name, and `test` because the
# program is one call into the library, whose tests cover it.
[[bin]]
name = "loom-app"
path = "src/bin/loom-app.rs"
doc = false
test = false

[features]
default = ["complex-scripts"]
# Dictionary word breaking for text fields in Thai, Lao, Khmer, Burmese,
# Chinese, and Japanese: loom-ui's `complex-scripts`, about 3 MiB of a
# release build. On by default (decided 2026-11-16); a smaller build, such
# as a plugin, can leave it out with `--no-default-features`. Because Cargo
# unifies features, any build that has loom-app with its defaults has it on
# everywhere, the canvas included.
complex-scripts = ["loom-ui/complex-scripts"]
# The headless `Ui` harness, for the tests in `tests/`. It changes no behaviour.
# It needs loom-ui's test driver access to the app (`Runtime::app_mut`).
test-ui = ["loom-ui/test-driver", "loom-ui/testing"]

[dependencies]
loom-core.workspace = true
loom-dsp.workspace = true
# `test-modules`: the `test.` modules, for --test-modules and the app's tests.
loom-modules = { workspace = true, features = ["test-modules"] }
loom-patch.workspace = true
loom-host-desktop.workspace = true
loom-canvas.workspace = true
loom-ui-core.workspace = true
loom-ui = { workspace = true, features = ["shell"] }
iced_wgpu.workspace = true
iced_renderer.workspace = true
# The window on loom-ui's shell: Iced's event conversion and clipboard, and
# the window type the layers are handed (docs/dev/leaving-iced-plan.md, 2.2b-ii).
iced_winit.workspace = true
winit.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
iced = { workspace = true, features = ["smol", "markdown"] }
clap.workspace = true
rfd.workspace = true
ron.workspace = true
# Parses help's notes once, for the view and the accessibility tree.
pulldown-cmark.workspace = true
etcetera.workspace = true
jiff.workspace = true
# Runs widget operations on the live window, for the control channel.
iced_runtime.workspace = true
# The spectrum display. On the telemetry thread only, never in the engine crates.
rustfft.workspace = true
# The accessibility tree for screen readers (ADR-0041). Built and tested on
# every platform; `a11y/macos.rs` attaches it to the window.
accesskit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Where Documents really is: OneDrive or the user can move it (#556).
known-folders = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
hound.workspace = true
loom-analysis.workspace = true
loom-patch = { workspace = true, features = ["test-follows"] }
# `test-ui`: lets the tests in `tests/` import `Ui`.
loom-app = { path = ".", features = ["test-ui"] }
# `testing`: the recording painter, so a test reads what the runtime paints.
loom-ui = { workspace = true, features = ["shell", "testing"] }

[lints]
workspace = true
