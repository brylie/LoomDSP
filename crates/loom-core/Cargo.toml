[package]
name = "loom-core"
description = "LoomDSP engine core: module API, runtime-editable DSP graph, and real-time engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["audio", "dsp", "modular", "synthesizer", "realtime"]
categories = ["multimedia::audio"]
# The test targets are listed below: the files in `tests/` are modules
# of `tests/main.rs`, not binaries of their own.
autotests = false

[dependencies]
loom-midi.workspace = true
loom-dsp.workspace = true
loom-rt.workspace = true
rtrb.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# Each of these installs a global allocator, which applies to its whole
# binary, so it keeps a binary of its own.
[[test]]
name = "displays"
path = "tests/displays.rs"

[[test]]
name = "stereo_no_alloc"
path = "tests/stereo_no_alloc.rs"

[[test]]
name = "transport_no_alloc"
path = "tests/transport_no_alloc.rs"

[lints]
workspace = true
