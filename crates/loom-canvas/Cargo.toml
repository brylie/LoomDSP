[package]
name = "loom-canvas"
description = "The LoomDSP patch canvas: input and wgpu drawing as plain code, with an Iced widget around them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["audio", "modular", "node-editor", "wgpu"]
categories = ["gui", "multimedia::audio"]

[dependencies]
loom-ui-core.workspace = true
# Painting: text, boxes, and their GPU renderer (`loom_ui::paint`), with no
# window shell.
loom-ui = { workspace = true, features = ["gpu"] }
wgpu.workspace = true
bytemuck.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The recording painter, for the tests of what the canvas paints.
loom-ui = { workspace = true, features = ["gpu", "testing"] }
# Same version as wgpu's own shader translator, to validate canvas.wgsl in tests.
naga = { version = "27", features = ["wgsl-in", "msl-out"] }
