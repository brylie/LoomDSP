[package]
name = "loom-canvas"
description = "The LoomDSP patch canvas: input and wgpu drawing as plain code, with an Iced widget around them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["audio", "modular", "node-editor", "iced", "wgpu"]
categories = ["gui", "multimedia::audio"]

[dependencies]
loom-ui-core.workspace = true
iced = { workspace = true }
iced_wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
parley.workspace = true
fontique.workspace = true
swash.workspace = true
etagere.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Same version as wgpu's own shader translator, to validate canvas.wgsl in tests.
naga = { version = "27", features = ["wgsl-in", "msl-out"] }
