[package]
name = "loom-ui"
description = "A UI runtime: events in, one update per message, effects as plain values, and a driver trait, with no window toolkit behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["gui", "ui", "runtime", "accessibility"]
categories = ["gui"]

# The runtime and the App trait name no window toolkit (docs/design/ui-layer.md,
# section 2, rule 9). Only the `shell` module does, and only with the `shell`
# feature, so a build without it proves the runtime needs no toolkit.
[dependencies]
loom-ui-core.workspace = true
# Lays out panels (`layout.rs`). No taffy type is in our public API.
taffy.workspace = true
winit = { workspace = true, optional = true }
# wgpu's own defaults, which hold its backends: the app gets them through Iced,
# and the shell alone needs them too. No crate beyond what Iced brings.
wgpu = { workspace = true, optional = true, features = ["default"] }
pollster = { workspace = true, optional = true }

[features]
default = ["shell"]
# The winit shell: a window, its GPU surface, and the loop that drives the
# runtime (`loom_ui::shell`).
shell = ["dep:winit", "dep:wgpu", "dep:pollster"]
# `Runtime::app_mut`, for a test driver that sets up the app's state between
# turns. A real driver never changes the app outside `update` (section 2,
# rule 1), so nothing turns this on outside tests.
test-driver = []

[dev-dependencies]
# Saves the window example's `--capture` frame.
png.workspace = true

# The shell in a real window; it needs the `shell` feature.
[[example]]
name = "window"
required-features = ["shell"]

[lints]
workspace = true
