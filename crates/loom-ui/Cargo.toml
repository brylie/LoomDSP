[package]
name = "loom-ui"
description = "A UI runtime: events in, one update per message, effects as plain values, and a driver trait, with no window toolkit behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["gui", "ui", "runtime", "accessibility"]
categories = ["gui"]

# The runtime and the App trait name no window toolkit (docs/design/ui-layer.md,
# section 2, rule 9). Only the `shell` module does, and only with the `shell`
# feature, so a build without it proves the runtime needs no toolkit.
[dependencies]
loom-ui-core.workspace = true
# Lays out panels (`layout.rs`). No taffy type is in our public API.
taffy.workspace = true
# The accessibility tree's types, plain data with no toolkit: the effect that
# hands the screen reader the tree, and the events a screen reader sends
# (docs/design/ui-layer.md, section 7). The version `loom-app` builds the tree
# with.
accesskit = "0.25"
# Painting (`paint`): text set with Parley over fontique's font collection,
# glyphs rasterised with swash and packed with etagere, and the instance
# types laid out with bytemuck (docs/design/ui-layer.md, section 8, rule 8).
# None of them is a window toolkit, and the GPU renderer is behind `gpu`.
parley.workspace = true
fontique.workspace = true
swash.workspace = true
etagere.workspace = true
bytemuck.workspace = true
winit = { workspace = true, optional = true }
# wgpu's own defaults, which hold its backends: the app gets them through Iced,
# and the shell and the paint renderer alone need them too. No crate beyond
# what Iced brings.
wgpu = { workspace = true, optional = true, features = ["default"] }
pollster = { workspace = true, optional = true }
# The platform's screen reader adapter in the shell's window: macOS, Windows,
# and, with its default features, Linux through AT-SPI (section 7, rule 11).
accesskit_winit = { version = "0.34", optional = true }
# The system clipboard, text only (no `image-data`), with the Wayland
# data-control protocol where a compositor offers it (ui-layer.md,
# section 8, rule 2).
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"], optional = true }

# On Linux the clipboard reads Wayland itself, so a read has a deadline
# (ui-layer.md, section 8, rule 2): `wl-clipboard-rs` asks the compositor for
# the text, and `rustix` waits on its pipe with a timer the system holds.
# Both are already in the tree through `arboard`.
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = { version = "0.9", optional = true }
rustix = { version = "1", features = ["event", "time"], optional = true }

[features]
default = ["shell"]
# The winit shell: a window, its GPU surface, and the loop that drives the
# runtime (`loom_ui::shell`).
shell = ["gpu", "clipboard", "dep:winit", "dep:wgpu", "dep:pollster", "dep:accesskit_winit"]
# The system clipboard on a thread of its own (`loom_ui::clipboard`), for
# any desktop driver: the winit shell, and a plugin's with no winit.
clipboard = ["dep:arboard", "dep:wl-clipboard-rs", "dep:rustix"]
# The paint renderer (`paint::PaintRenderer`): wgpu, and no window.
gpu = ["dep:wgpu"]
# The recording painter (`paint::testing`), for other crates' tests.
testing = []
# Dictionary word and line breaking in Thai, Lao, Khmer, Burmese, Chinese,
# and Japanese, for word movement in text fields (Parley's
# `complex-scripts`; ui-layer.md, section 8, rule 8). It adds about 3 MiB
# of segmenter data to a release build. Cargo turns a feature on for every
# crate in the build that uses Parley, so with it the canvas's text breaks
# lines the same way; the example patches draw byte for byte the same.
complex-scripts = ["parley/complex-scripts"]
# `Runtime::app_mut`, for a test driver that sets up the app's state between
# turns. A real driver never changes the app outside `update` (section 2,
# rule 1), so nothing turns this on outside tests.
test-driver = []

[dev-dependencies]
# Same version as wgpu's own shader translator, to validate paint.wgsl in tests.
naga = { version = "27", features = ["wgsl-in", "msl-out"] }
# Saves the window example's `--capture` frame.
png.workspace = true

# The shell in a real window; it needs the `shell` feature.
[[example]]
name = "window"
required-features = ["shell"]

[lints]
workspace = true
