[package]
name = "loom-cli"
description = "LoomDSP command-line tool: play, render, check, and stress-test patches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["audio", "synthesizer", "modular", "midi", "dsp"]
categories = ["multimedia::audio", "command-line-utilities"]
# The test targets are listed below: the files in `tests/` are modules
# of `tests/main.rs`, not binaries of their own.
autotests = false

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-core.workspace = true
loom-modules.workspace = true
loom-patch.workspace = true
loom-host-desktop.workspace = true
loom-rt.workspace = true
clap.workspace = true
ctrlc.workspace = true
jiff.workspace = true
hound.workspace = true
loom-analysis.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
