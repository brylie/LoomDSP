# Git hooks for LoomDSP, run by prek (https://prek.j178.dev).
#
# Setup, once per clone:
#   mise trust            # let mise read mise.toml
#   mise install          # installs Rust, prek, typos, cargo-deny, cargo-llvm-cov, cargo-nextest
#   prek install          # installs the pre-commit and pre-push hooks
#
# Run by hand:
#   prek run                                     # checks staged files
#   prek run --all-files                         # every quick check
#   prek run --hook-stage pre-push --all-files   # the same, as a push runs them
#   prek run --hook-stage manual --all-files     # the slow checks (CI runs them too)
#
# Why these stages: the quick checks (file checks, fmt, clippy, typos, and
# the repository's own scripts) take seconds, so they run on every commit,
# while the change is fresh. They run again before push, because commits
# made by a rebase or a merge never ran the commit hooks. The slow checks
# (tests with coverage, doc tests, docs, the WebAssembly build, and
# cargo-deny) are in the manual stage: CI runs every one of them on the pull
# request, and `mise run check-full` runs them all locally. Why not before
# push: several agent sessions on one machine each ran the full check and
# then the same checks again in the hook, and parallel full checks starve
# the CPU.
#
# Each check runs through scripts/devtel/run.sh, which records how long it
# took for the development telemetry (docs/dev/devtel.md) and otherwise
# runs the command unchanged: same output, same exit code.
#
# Every hook that needs a tool runs it through mise (`mise run` or
# `mise exec --`), so it uses the versions pinned in mise.toml and does not
# depend on what is on PATH. This matters most in agent sandboxes and fresh
# worktrees. mise refuses to read an untrusted mise.toml, and then every one
# of these hooks fails, so run `mise trust` once per worktree (see above).
# A repository cannot trust itself; that choice stays with the person.
#
# The Rust checks call the tasks in mise.toml, which CI runs too, so a check
# that passes here passes the same way in CI. CI also runs the tests on
# Windows and Linux and checks the minimum Rust version.

# The post-* hooks only record git events for devtel (docs/dev/devtel.md);
# they never fail. After this list changes, run `prek install` again.
default_install_hook_types = ["pre-commit", "pre-push", "post-commit", "post-checkout", "post-merge", "post-rewrite"]
default_stages = ["pre-commit", "pre-push"]

# Build output, and third-party agent skills vendored into .agents/, are not
# ours to reformat.
exclude = { glob = ["**/target/**", ".agents/**"] }

# ---------------------------------------------------------------------------
# Fast, built-in file checks (no network, no setup).
# ---------------------------------------------------------------------------

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
# Two trailing spaces are a line break in Markdown, so keep them there.
args = ["--markdown-linebreak-ext=md"]

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-added-large-files"
# Screenshots are fine; audio renders and binaries are not.
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
# Changes reach main through pull requests, so CI always runs first.
id = "no-commit-to-branch"
args = ["--branch", "main"]

# ---------------------------------------------------------------------------
# Quick checks on every commit and push.
# ---------------------------------------------------------------------------

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
# Formats in place. If it changes anything, the commit stops so you can
# review and stage the result.
entry = "sh scripts/devtel/run.sh cargo-fmt mise exec -- cargo fmt --all"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
# Same lint policy as CI (workspace Cargo.toml), with warnings as errors.
entry = "sh scripts/devtel/run.sh cargo-clippy mise run --quiet clippy"
language = "system"
files = "(\\.rs|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "typos"
name = "typos (spelling)"
# --force-exclude applies _typos.toml excludes to the files prek passes in.
# Only the changed files are checked here; `mise run typos` checks them all.
entry = "sh scripts/devtel/run.sh typos mise exec -- typos --force-exclude"
language = "system"
types = ["text"]

[[repos.hooks]]
id = "adr-status"
name = "ADR status lines"
# Checks the changed ADRs against their index rows; `mise run adr-status`
# (and CI) checks them all.
entry = "sh scripts/devtel/run.sh adr-status sh scripts/check-adr-status.sh"
language = "system"
files = "^docs/adr/[0-9]{4}-.*\\.md$"

[[repos.hooks]]
id = "adr-citations"
name = "ADR citations in agent instruction files"
# Checks every instruction file, because superseding an ADR can make a
# citation in an unchanged skill stale.
entry = "sh scripts/devtel/run.sh adr-citations sh scripts/check-adr-citations.sh"
language = "system"
files = "^(docs/adr/[0-9]{4}-.*|(.*/)?(AGENTS|CLAUDE)|\\.claude/.*)\\.md$"
pass_filenames = false

[[repos.hooks]]
id = "test-placement"
name = "Tests in their own files"
# Checks every crate, because a moved test file affects its parent.
entry = "sh scripts/devtel/run.sh test-placement sh scripts/check-test-placement.sh"
language = "system"
files = "^crates/.*\\.rs$"
pass_filenames = false

# ---------------------------------------------------------------------------
# Slow checks, run by hand (`prek run --hook-stage manual --all-files`), by
# `mise run check-full`, and by CI on every pull request.
# ---------------------------------------------------------------------------

[[repos.hooks]]
id = "coverage"
name = "cargo test with line coverage"
# Runs every test once (debug build, so the no-allocation test on the audio
# path is active) and fails when line coverage is under the threshold that
# GitHub enforces on pull requests (LOOM_COVERAGE_MIN in mise.toml).
entry = "sh scripts/devtel/run.sh coverage mise run --quiet coverage"
language = "system"
files = "(\\.rs|\\.ron|\\.wav|Cargo\\.toml|Cargo\\.lock|mise\\.toml)$"
pass_filenames = false
require_serial = true
stages = ["manual"]

[[repos.hooks]]
id = "doctest"
name = "cargo test --doc (examples in the API docs)"
# Coverage does not run doc tests, so they run as a hook of their own.
entry = "sh scripts/devtel/run.sh doctest mise run --quiet doctest"
language = "system"
files = "(\\.rs|\\.md|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true
stages = ["manual"]

[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc (warnings as errors)"
entry = "sh scripts/devtel/run.sh cargo-doc mise run --quiet docs"
language = "system"
files = "(\\.rs|\\.md|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true
stages = ["manual"]

[[repos.hooks]]
id = "wasm"
name = "WebAssembly build of the engine crates"
entry = "sh scripts/devtel/run.sh wasm mise run --quiet wasm"
language = "system"
files = "(\\.rs|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true
stages = ["manual"]

[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny (licences, advisories)"
entry = "sh scripts/devtel/run.sh cargo-deny mise run --quiet deny"
language = "system"
files = "(Cargo\\.toml|Cargo\\.lock|deny\\.toml)$"
pass_filenames = false
stages = ["manual"]

# ---------------------------------------------------------------------------
# Development telemetry (docs/dev/devtel.md). Records commits, checkouts,
# merges, rewrites, and pushes as spans in a local folder outside the
# repository. Each runs in the background, so git does not wait for it, and
# always passes, so it never stops a commit or a push. Off in CI and with
# LOOM_DEVTEL=0. prek does not tell a hook which stage runs it, so each
# stage has its own entry.
# ---------------------------------------------------------------------------

[[repos]]
repo = "local"

[[repos.hooks]]
id = "devtel-post-commit"
name = "devtel: record post-commit"
entry = "sh -c '(mise exec -- python3 scripts/devtel/devtel.py git post-commit >/dev/null 2>&1 &); exit 0'"
language = "system"
always_run = true
pass_filenames = false
stages = ["post-commit"]

[[repos.hooks]]
id = "devtel-post-checkout"
name = "devtel: record post-checkout"
entry = "sh -c '(mise exec -- python3 scripts/devtel/devtel.py git post-checkout >/dev/null 2>&1 &); exit 0'"
language = "system"
always_run = true
pass_filenames = false
stages = ["post-checkout"]

[[repos.hooks]]
id = "devtel-post-merge"
name = "devtel: record post-merge"
entry = "sh -c '(mise exec -- python3 scripts/devtel/devtel.py git post-merge >/dev/null 2>&1 &); exit 0'"
language = "system"
always_run = true
pass_filenames = false
stages = ["post-merge"]

[[repos.hooks]]
id = "devtel-post-rewrite"
name = "devtel: record post-rewrite"
entry = "sh -c '(mise exec -- python3 scripts/devtel/devtel.py git post-rewrite >/dev/null 2>&1 &); exit 0'"
language = "system"
always_run = true
pass_filenames = false
stages = ["post-rewrite"]

[[repos.hooks]]
id = "devtel-pre-push"
name = "devtel: record pre-push"
entry = "sh -c '(mise exec -- python3 scripts/devtel/devtel.py git pre-push >/dev/null 2>&1 &); exit 0'"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]
