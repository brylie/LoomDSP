# Git hooks for LoomDSP, run by prek (https://prek.j178.dev).
#
# Setup, once per clone:
#   mise trust            # let mise read mise.toml
#   mise install          # installs Rust, prek, typos, cargo-deny, cargo-llvm-cov, cargo-nextest
#   prek install          # installs the pre-commit and pre-push hooks
#
# Run by hand:
#   prek run                                     # checks staged files
#   prek run --all-files                         # every pre-commit check
#   prek run --hook-stage pre-push --all-files   # every pre-push check
#
# Why two stages: checks that take a second or two run on every commit, so
# you hear about problems while the change is fresh. Slower checks (tests
# with coverage, docs, the WebAssembly build, dependency licences) run before
# push.
#
# The Rust checks call the tasks in mise.toml, which CI runs too, so a push
# that passes these hooks passes the same checks in CI. CI also runs the
# tests on Windows and Linux and checks the minimum Rust version.

default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

# Build output, and third-party agent skills vendored into .agents/, are not
# ours to reformat.
exclude = { glob = ["**/target/**", ".agents/**"] }

# ---------------------------------------------------------------------------
# Fast, built-in file checks (no network, no setup).
# ---------------------------------------------------------------------------

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
# Two trailing spaces are a line break in Markdown, so keep them there.
args = ["--markdown-linebreak-ext=md"]

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-added-large-files"
# Screenshots are fine; audio renders and binaries are not.
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
# Changes reach main through pull requests, so CI always runs first.
id = "no-commit-to-branch"
args = ["--branch", "main"]

# ---------------------------------------------------------------------------
# Rust checks on every commit.
# ---------------------------------------------------------------------------

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
# Formats in place. If it changes anything, the commit stops so you can
# review and stage the result.
entry = "cargo fmt --all"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
# Same lint policy as CI (workspace Cargo.toml), with warnings as errors.
entry = "mise run --quiet clippy"
language = "system"
files = "(\\.rs|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "typos"
name = "typos (spelling)"
# --force-exclude applies _typos.toml excludes to the files prek passes in.
# Only the changed files are checked here; `mise run typos` checks them all.
entry = "typos --force-exclude"
language = "system"
types = ["text"]

# ---------------------------------------------------------------------------
# Slower checks before push.
# ---------------------------------------------------------------------------

[[repos.hooks]]
id = "coverage"
name = "cargo test with line coverage"
# Runs every test once (debug build, so the no-allocation test on the audio
# path is active) and fails when line coverage is under the threshold that
# GitHub enforces on pull requests (LOOM_COVERAGE_MIN in mise.toml).
entry = "mise run --quiet coverage"
language = "system"
files = "(\\.rs|\\.ron|\\.wav|Cargo\\.toml|Cargo\\.lock|mise\\.toml)$"
pass_filenames = false
require_serial = true
stages = ["pre-push"]

[[repos.hooks]]
id = "doctest"
name = "cargo test --doc (examples in the API docs)"
# Coverage does not run doc tests, so they run here.
entry = "mise run --quiet doctest"
language = "system"
files = "(\\.rs|\\.md|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc (warnings as errors)"
entry = "mise run --quiet docs"
language = "system"
files = "(\\.rs|\\.md|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true
stages = ["pre-push"]

[[repos.hooks]]
id = "wasm"
name = "WebAssembly build of the engine crates"
entry = "mise run --quiet wasm"
language = "system"
files = "(\\.rs|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny (licences, advisories)"
entry = "mise run --quiet deny"
language = "system"
files = "(Cargo\\.toml|Cargo\\.lock|deny\\.toml)$"
pass_filenames = false
stages = ["pre-push"]
