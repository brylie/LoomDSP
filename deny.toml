# Dependency policy (ADR-0006). Run with: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices for crates deep inside the UI stack, which we cannot
# replace ourselves. Neither is a security vulnerability. Review when Iced or
# wgpu is upgraded (OQ-14); remove an entry once upstream drops the crate.
ignore = [
    # paste: proc macro used by metal (wgpu's macOS backend).
    { id = "RUSTSEC-2024-0436", reason = "via wgpu-hal/metal; unmaintained, not vulnerable" },
    # ttf-parser: font parsing used by cosmic-text (Iced's text system).
    { id = "RUSTSEC-2026-0192", reason = "via iced_wgpu/cosmic-text; unmaintained, not vulnerable" },
]

[licenses]
version = 2
# Permissive licences only. Copyleft licences (GPL, LGPL, AGPL, MPL without
# review, SSPL, and similar) are not allowed, because they would pass on to
# every plugin users export.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory: keep licences we would
# accept even if no current dependency uses them.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
