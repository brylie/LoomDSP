# Spell-check configuration for the `typos` CI job.
[files]
# Generated files: hashes and crate names, not prose.
# Third-party agent skills vendored into .agents/ are not ours to fix.
extend-exclude = ["*.lock", "*.png", "target/", ".agents/"]

[default.extend-words]
# A resonance of the vocal tract; formant filters shape sounds toward vowels.
formant = "formant"
# Creative Commons NoDerivatives, as in the SPDX licence CC-BY-ND-4.0.
ND = "ND"
