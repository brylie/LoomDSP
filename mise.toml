# Development tools and checks for LoomDSP.
#
# Setup, once per clone (see CONTRIBUTING.md):
#   mise trust            # let mise read this file
#   mise install          # installs the tools below
#   prek install          # installs the git hooks (see prek.toml)
#
# The tasks below are the one list of quality checks. The git hooks
# (prek.toml) and CI (.github/workflows/ci.yml) run these same tasks, so a
# check that passes on your machine passes in CI. Run them by hand with
# `mise run <task>`. `mise run check` is the local check, and
# `mise run check-full` runs everything CI runs, coverage included.

[tools]
# clippy and rustfmt for the lint and format checks, llvm-tools for coverage,
# and the WebAssembly target for the portability check (hard rule 6).
# `minimum_release_age = "0s"` lets CI use a new Rust release on release day
# instead of holding `latest` on the previous one for 24 hours.
rust = { version = "latest", components = "clippy,rustfmt,llvm-tools-preview", targets = "wasm32-unknown-unknown", minimum_release_age = "0s" }
# Line coverage, for the coverage check and the CI uploads.
"aqua:taiki-e/cargo-llvm-cov" = "latest"
# Test runner for the coverage check; writes the JUnit report for Codecov.
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
# Git hook runner (see prek.toml).
prek = "latest"
# Used by the checks below, in the hooks, and in CI.
"aqua:crate-ci/typos" = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
gh = "latest"
# Local development telemetry (scripts/devtel, docs/dev/devtel.md). Its
# scripts use only the standard library; DuckDB and the trace viewer are
# fetched by `mise exec` when a devtel task first needs them (pinned in
# [env] below), so other tasks and CI never download them.
# An exact version: mise 2025.9 cannot install 3.13.18 and later (it picks
# the free-threaded build and fails), so a range would break older mise.
python = "3.13.11"
# A shared compile cache, so worktrees reuse each other's builds of the
# same dependencies (scripts/rustc-wrapper.sh). A command-line tool only,
# never linked into the crates (Apache-2.0).
"aqua:mozilla/sccache" = "latest"

[env]
# Minimum line coverage, in percent. It must match the "Restrict code
# coverage" rule of the main branch ruleset on GitHub, so the local check
# fails exactly when the pull request would be blocked.
LOOM_COVERAGE_MIN = "80"
# Local development telemetry (docs/dev/devtel.md). The tools it runs with
# `mise exec`. DuckDB comes from GitHub releases, because the aqua registry
# entry in older mise versions does not match DuckDB 2's file names.
LOOM_DEVTEL_DUCKDB = "github:duckdb/duckdb@2.0.1"
LOOM_DEVTEL_VIEWER = "github:CtrlSpice/otel-desktop-viewer@0.8.0"

[tasks.fmt]
description = "Check formatting (cargo fmt --all fixes it)"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Lint, with warnings as errors (lint groups are in Cargo.toml)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run every test (debug build, so the no-allocation test is active)"
# Ubuntu 26.04's Vulkan loader can crash when concurrent offscreen tests
# use separate GPU devices in the same process (LoomDSP #827).
# https://github.com/KhronosGroup/Vulkan-Loader/issues/1863
# Nextest gives each test a process of its own. Cargo runs the doc tests.
# The nextest run waits in the machine-wide test queue (docs/dev/test-runs.md);
# the queue is off in CI. It builds first, then runs every test.
run = ["python3 scripts/test_run.py --all", "mise run doctest"]

[tasks.coverage]
description = "Run every test with line coverage, and fail under LOOM_COVERAGE_MIN"
# Debug build like `test`, so the no-allocation test still runs. The tests
# run with nextest; its `ci` profile (.config/nextest.toml) writes a JUnit
# report for Codecov's test results. The first command removes every
# instrumented build and profile from earlier runs. Without it, `cargo
# llvm-cov report` also reads test binaries that older trees left in a
# reused target folder, and counts their code as unrun, so files a change
# never touched can fall to near 0%. `clean --workspace` is not enough
# there: it keeps binaries of tests the current tree no longer has.
# CI sets LOOM_COVERAGE_CLEAN=workspace, and then only the workspace's own
# builds and profiles go. CI's target folder comes from rust-cache, which
# saves dependency builds only and never a workspace crate, so it holds no
# old test binaries, and a full clean would only throw away the dependency
# builds it just restored (about 2 minutes to build again). The second
# command runs the tests and writes the lcov file for Codecov. The others
# write the Cobertura file for GitHub and report the same data per file
# with the minimum. Tests that
# need hardware live in `device_tests.rs` files and are ignored, so their
# code is left out of the measurement. Doc tests are not measured; the
# `doctest` task runs them.
run = [
  # A mise template, not a shell `if`, so the line runs in any shell,
  # including cmd on Windows.
  '''cargo llvm-cov clean{% if get_env(name="LOOM_COVERAGE_CLEAN", default="all") == "workspace" %} --workspace{% endif %}''',
  # The test run waits in the machine-wide test queue (docs/dev/test-runs.md),
  # build included, since llvm-cov builds and runs in one command. Off in CI.
  '''python3 scripts/test_run.py queue -- cargo llvm-cov nextest --workspace --profile ci --ignore-filename-regex 'device_tests\.rs$' --lcov --output-path target/lcov.info''',
  '''cargo llvm-cov report --ignore-filename-regex 'device_tests\.rs$' --cobertura --output-path target/cobertura.xml''',
  '''cargo llvm-cov report --ignore-filename-regex 'device_tests\.rs$' --fail-under-lines {{env.LOOM_COVERAGE_MIN}}''',
]

[tasks.doctest]
description = "Run the examples in the API docs (coverage does not run them)"
run = "cargo test --workspace --doc"

[tasks.coverage-html]
description = "Open a line-by-line coverage report in the browser"
run = "cargo llvm-cov --workspace --html --open"

[tasks.docs]
description = "Build the API docs, with warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
# loom-app's items are private to the crate. The second command checks their
# doc links, which a library's public docs would not reach.
run = [
  "cargo doc --workspace --no-deps",
  "cargo doc -p loom-app --no-deps --document-private-items",
]

[tasks.wasm]
description = "Build the engine crates for WebAssembly (hard rule 6)"
# Warnings as errors, as in CI. This target is built only here, so the flag
# does not cause rebuilds of the native build.
env = { RUSTFLAGS = "-D warnings" }
run = "cargo build --target wasm32-unknown-unknown -p loom-rt -p loom-dsp -p loom-midi -p loom-core -p loom-modules -p loom-patch"

[tasks.msrv]
description = "Check that the workspace still builds with the minimum Rust version"
# Library and binary code only: dev-dependencies (benchmarks) may need a
# newer compiler, and users never build them. Keep in step with
# `rust-version` in Cargo.toml.
run = "mise exec rust@1.100.0 -- cargo check --workspace"

[tasks.deny]
description = "Check licences and advisories (ADR-0006)"
run = "cargo deny check"

# CI runs the two halves of `deny` as separate jobs (#143). Licences, bans,
# and sources change only when our files change, so they block every pull
# request. Advisories change when the RustSec database changes, so CI runs
# them only where a new one is ours to fix: on main, weekly, and on pull
# requests that change the dependencies.
[tasks.deny-policy]
description = "Check licences, banned crates, and sources (ADR-0006)"
run = "cargo deny check bans licenses sources"

[tasks.deny-advisories]
description = "Check the dependencies against the RustSec advisories"
run = "cargo deny check advisories"

[tasks.typos]
description = "Check spelling"
run = "typos"

[tasks.adr-status]
description = "Check that every ADR has one allowed status, matching the index (no Proposed ADRs on main), and that agent instruction files cite no superseded ADR"
# The second command tests the citation check itself on small example repositories.
run = ["sh scripts/check-adr-status.sh", "sh scripts/test-check-adr-citations.sh", "sh scripts/check-adr-citations.sh"]

[tasks.test-placement]
description = "Check that tests live in their own files, not inline in code modules, and that every integration test file is built, in as few binaries as it can be"
# Each check is tested on small example crates before it runs.
run = [
  "sh scripts/test-check-test-placement.sh",
  "sh scripts/check-test-placement.sh",
  "sh scripts/test-check-test-targets.sh",
  "sh scripts/check-test-targets.sh",
]

[tasks.portable]
description = "Check that the portable crates use no files, processes, threads, or clocks (hard rule 6)"
# A grep, because the wasm build cannot catch these: std builds them as
# stubs there. The first command tests the check itself on a small crate.
run = ["sh scripts/test-check-portable.sh", "sh scripts/check-portable.sh"]

[tasks.ui-no-toolkit]
description = "Build and test loom-ui without its window shell, to prove the runtime needs no toolkit"
# The shell is a default feature. Without it, loom-ui must still build, pass
# its tests, and pass its purity test (docs/design/ui-layer.md, section 2,
# rule 9; plan step 2.2).
run = "cargo test -p loom-ui --no-default-features"

[tasks.worktree-targets]
description = "Test worktree target ownership, orphan pruning, and the sweep of stale build output"
run = ["sh scripts/test-worktree-targets.sh", "sh scripts/test-sweep-targets.sh"]

[tasks.metrics]
description = "Measure the workspace for an architecture review: sizes, complexity, churn, rule checks, seams; writes target/metrics.md"
# The architecture review skill (.claude/skills/review-architecture) reads the
# same report. Informational: CI uploads it and does not fail on it.
# rust-code-analysis-cli gives cognitive and cyclomatic complexity per
# function from a real parser. It is a tool of this task only, not of the
# [tools] list above, so no other task or CI job compiles it (it builds
# tree-sitter grammars from C, minutes on a cache miss). A command-line tool
# only, never linked into the crates (MPL-2.0).
tools = { "cargo:rust-code-analysis-cli" = "latest" }
run = ["mkdir -p target", "python3 .claude/skills/review-architecture/scripts/measure.py > target/metrics.md", "sed -n '1,40p' target/metrics.md"]

[tasks.help-pages]
description = "Regenerate the module help pages in docs/modules from the descriptors"
# A test (`committed_pages_are_current` in loom-cli) fails while they are
# out of date. Notes below each page's marker line are kept.
run = "cargo run -p loom-cli -- modules --markdown docs/modules"

[tasks.check]
description = "The local check: fmt, clippy, typos, the file rules, and the tests the change can reach, with no coverage build"
# The quick checks first, then the tests once with nextest. No coverage:
# an instrumented build of the workspace costs far more CPU than a plain
# test run, and CI measures coverage on every pull request, so CI is the
# coverage gate. `check-full` runs everything CI runs, coverage included.
# The test step is scripts/test_run.py (docs/dev/test-runs.md): it runs
# only the crates the change can reach (LOOM_TEST_ALL=1 or `-- --all` runs
# every test), builds them, then waits for the machine-wide test queue, so
# one test run at a time uses every core instead of several fighting.
# With the queue off (LOOM_TEST_QUEUE=0) it uses half the cores, rounded
# up (LOOM_TEST_THREADS overrides it). `devtel-test` and `test-run-test` run here
# only: they test local development tooling (docs/dev/devtel.md), and CI
# never runs this task.
depends = ["fmt", "clippy", "typos", "adr-status", "test-placement", "portable", "devtel-test", "test-run-test"]
run = "python3 scripts/test_run.py"

[tasks.check-full]
description = "Run everything CI runs (all but msrv and the macOS and Windows test jobs), coverage included"
# coverage runs every test except doc tests, so `test` is not listed again;
# `doctest` covers the rest.
depends = ["fmt", "clippy", "typos", "adr-status", "test-placement", "portable", "ui-no-toolkit", "worktree-targets", "deny", "docs", "wasm", "coverage", "doctest"]

[tasks.devtel-report]
description = "Print the development efficiency report: time by kind of work, re-runs, loops, models, commits"
usage = 'flag "--days <days>" default="14" help="How many days back"'
run = "python3 scripts/devtel/devtel.py report --days ${usage_days}"

[tasks.devtel]
description = "Open every session as a trace waterfall in otel-desktop-viewer (docs/dev/devtel.md)"
usage = 'flag "--days <days>" default="14" help="How many days back"'
run = "python3 scripts/devtel/devtel.py traces --days ${usage_days}"
raw = true

[tasks.devtel-import]
description = "Copy new Claude Code transcripts and spool files into the devtel archive"
run = "python3 scripts/devtel/devtel.py import"

[tasks.test-run-test]
description = "Test the test queue and test selection script (docs/dev/test-runs.md)"
run = "python3 -m unittest discover -s scripts/tests -v"

[tasks.devtel-test]
description = "Test the development telemetry scripts"
run = "python3 -m unittest discover -s scripts/devtel/tests -v"
