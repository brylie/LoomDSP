# Development tools and checks for LoomDSP.
#
# Setup, once per clone (see CONTRIBUTING.md):
#   mise trust            # let mise read this file
#   mise install          # installs the tools below
#   prek install          # installs the git hooks (see prek.toml)
#
# The tasks below are the one list of quality checks. The git hooks
# (prek.toml) and CI (.github/workflows/ci.yml) run these same tasks, so a
# check that passes on your machine passes in CI. Run them by hand with
# `mise run <task>`, or all of them with `mise run check`.

[tools]
# clippy and rustfmt for the lint and format checks, llvm-tools for coverage,
# and the WebAssembly target for the portability check (hard rule 6).
rust = { version = "latest", components = "clippy,rustfmt,llvm-tools-preview", targets = "wasm32-unknown-unknown" }
# Line coverage, for the coverage check and the CI uploads.
"aqua:taiki-e/cargo-llvm-cov" = "latest"
# Test runner for the coverage check; writes the JUnit report for Codecov.
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
# Git hook runner (see prek.toml).
prek = "latest"
# Used by the checks below, in the hooks, and in CI.
"aqua:crate-ci/typos" = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
gh = "latest"

[env]
# Minimum line coverage, in percent. It must match the "Restrict code
# coverage" rule of the main branch ruleset on GitHub, so the local check
# fails exactly when the pull request would be blocked.
LOOM_COVERAGE_MIN = "80"

[tasks.fmt]
description = "Check formatting (cargo fmt --all fixes it)"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Lint, with warnings as errors (lint groups are in Cargo.toml)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run every test (debug build, so the no-allocation test is active)"
run = "cargo test --workspace"

[tasks.coverage]
description = "Run every test with line coverage, and fail under LOOM_COVERAGE_MIN"
# Debug build like `test`, so the no-allocation test still runs. The tests
# run with nextest; its `ci` profile (.config/nextest.toml) writes a JUnit
# report for Codecov's test results. The first command is a normal coverage
# run: it clears the data of earlier runs, so a removed test cannot leave
# its old coverage behind, and it writes the lcov file for Codecov. The
# others write the Cobertura file for GitHub and report the same data per
# file with the minimum. Tests that need hardware live in `device_tests.rs`
# files and are ignored, so their code is left out of the measurement. Doc
# tests are not measured; the `doctest` task runs them.
run = [
  '''cargo llvm-cov nextest --workspace --profile ci --ignore-filename-regex 'device_tests\.rs$' --lcov --output-path target/lcov.info''',
  '''cargo llvm-cov report --ignore-filename-regex 'device_tests\.rs$' --cobertura --output-path target/cobertura.xml''',
  '''cargo llvm-cov report --ignore-filename-regex 'device_tests\.rs$' --fail-under-lines {{env.LOOM_COVERAGE_MIN}}''',
]

[tasks.doctest]
description = "Run the examples in the API docs (coverage does not run them)"
run = "cargo test --workspace --doc"

[tasks.coverage-html]
description = "Open a line-by-line coverage report in the browser"
run = "cargo llvm-cov --workspace --html --open"

[tasks.docs]
description = "Build the API docs, with warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps"

[tasks.wasm]
description = "Build the engine crates for WebAssembly (hard rule 6)"
# Warnings as errors, as in CI. This target is built only here, so the flag
# does not cause rebuilds of the native build.
env = { RUSTFLAGS = "-D warnings" }
run = "cargo build --target wasm32-unknown-unknown -p loom-rt -p loom-core -p loom-modules -p loom-patch"

[tasks.msrv]
description = "Check that the workspace still builds with the minimum Rust version"
# Library and binary code only: dev-dependencies (benchmarks) may need a
# newer compiler, and users never build them. Keep in step with
# `rust-version` in Cargo.toml.
run = "mise exec rust@1.99 -- cargo check --workspace"

[tasks.deny]
description = "Check licences and advisories (ADR-0006)"
run = "cargo deny check"

# CI runs the two halves of `deny` as separate jobs (#143). Licences, bans,
# and sources change only when our files change, so they block every pull
# request. Advisories change when the RustSec database changes, so CI runs
# them only where a new one is ours to fix: on main, weekly, and on pull
# requests that change the dependencies.
[tasks.deny-policy]
description = "Check licences, banned crates, and sources (ADR-0006)"
run = "cargo deny check bans licenses sources"

[tasks.deny-advisories]
description = "Check the dependencies against the RustSec advisories"
run = "cargo deny check advisories"

[tasks.typos]
description = "Check spelling"
run = "typos"

[tasks.adr-status]
description = "Check that every ADR has one allowed status, matching the index (no Proposed ADRs on main)"
run = "sh scripts/check-adr-status.sh"

[tasks.worktree-targets]
description = "Test worktree target ownership and orphan pruning"
run = "sh scripts/test-worktree-targets.sh"

[tasks.help-pages]
description = "Regenerate the module help pages in docs/modules from the descriptors"
# A test (`committed_pages_are_current` in loom-cli) fails while they are
# out of date. Notes below each page's marker line are kept.
run = "cargo run -p loom-cli -- modules --markdown docs/modules"

[tasks.check]
description = "Run the checks CI runs (all but msrv and the three-OS test matrix)"
# coverage runs every test except doc tests, so `test` is not listed again;
# `doctest` covers the rest.
depends = ["fmt", "clippy", "typos", "adr-status", "worktree-targets", "deny", "docs", "wasm", "coverage", "doctest"]
