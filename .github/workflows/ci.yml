name: CI

# Every Rust check runs a task from mise.toml, with tools installed by mise
# at the versions mise.toml names. The git hooks (prek.toml) run the same
# tasks, so a push that passes locally passes here. To change a check,
# change its task in mise.toml, not the command here.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches new security advisories and toolchain breakage even
  # when nobody pushes.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail CI. Locally they stay warnings for a fast edit loop, except
  # in the clippy, docs, and wasm tasks, which set them as errors themselves.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Lint groups are configured in the workspace Cargo.toml.
      - run: mise run clippy

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, so this also covers aarch64.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Debug build on purpose: the no-allocation test (NFR-RT-06) is only
      # active with debug assertions.
      - run: mise run test
      - name: Benchmarks compile
        run: cargo bench -p loom-modules --no-run

  # Line coverage for GitHub Code Quality. The "Restrict code coverage" rule
  # of the main branch ruleset reads the uploaded report: at least
  # LOOM_COVERAGE_MIN percent (mise.toml), and no more than 1 point below
  # main. The rule does not wait for the upload, so this job is part of
  # "CI success", which the ruleset requires.
  # Docs: https://docs.github.com/en/code-security/how-tos/maintain-quality-code/set-up-code-coverage
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload the report to GitHub's code coverage API.
      code-quality: write
      # Find the pull request of a pushed commit.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The PR head commit, not the merge commit, so coverage line
          # numbers match the diff.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Runs the tests once, writes target/cobertura.xml, and fails under
      # LOOM_COVERAGE_MIN.
      - name: Tests with line coverage
        run: mise run coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('target/cobertura.xml') != '' }}
        run: |
          cargo llvm-cov report > coverage.txt
          {
            echo '## Test coverage'
            echo
            echo "Minimum line coverage: ${LOOM_COVERAGE_MIN}%"
            echo
            echo '```'
            head -n 3 coverage.txt
            tail -n 1 coverage.txt
            echo '```'
            echo
            echo '<details><summary>Every file</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('target/cobertura.xml') != '' }}
        with:
          name: coverage-cobertura
          path: target/cobertura.xml
      # Uploads on pushes to main (the baseline) and on pull requests, also
      # when the coverage is under the minimum, so the PR comment shows why.
      # A pull request from a fork gets a read-only token and cannot upload;
      # see CONTRIBUTING.md, "Coverage and code quality gates".
      - name: Upload coverage to GitHub
        if: >-
          ${{ !cancelled() && hashFiles('target/cobertura.xml') != '' && (
            github.event_name == 'push' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) }}
        uses: actions/upload-code-coverage@v1
        with:
          file: target/cobertura.xml
          language: Rust
          label: code-coverage/llvm-cov

  docs:
    name: Docs (NFR-OSS-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: mise run docs

  msrv:
    name: Minimum Rust version (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Warnings are allowed here: a lint added in a newer compiler should
      # not fail the check of an older one.
      - run: mise run msrv
        env:
          RUSTFLAGS: ""

  wasm:
    name: WebAssembly build (NFR-PORT-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run wasm

  deny:
    name: Licences and advisories (ADR-0006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run deny

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run typos

  # One check to mark as "required" in the main branch ruleset, instead of
  # listing every job. Fails if any job above failed or was cancelled.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, coverage, docs, msrv, wasm, deny, typos]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
