name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches new security advisories and toolchain breakage even
  # when nobody pushes.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail CI. Locally they stay warnings for a fast edit loop.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Lint groups are configured in the workspace Cargo.toml.
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, so this also covers aarch64.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Debug build on purpose: the no-allocation test (NFR-RT-06) is only
      # active with debug assertions.
      - run: cargo test --workspace
      - name: Benchmarks compile
        run: cargo bench -p loom-modules --no-run

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Job-level, so the Codecov step's `if` can see it.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # The CLI and desktop host need audio hardware, so they are measured
      # but not expected to be covered by unit tests. nextest runs the tests
      # so the `ci` profile (.config/nextest.toml) writes a JUnit report.
      # It skips doctests; the Test job still runs them.
      # Tests that need hardware live in `device_tests.rs` files. They are
      # ignored here, so their code is left out of the measurement.
      - name: Measure coverage
        run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path lcov.info --ignore-filename-regex 'device_tests\.rs$'
      - name: Coverage summary
        run: |
          {
            echo '## Test coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex 'device_tests\.rs$'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
      # Optional: set the CODECOV_TOKEN repository secret to publish reports
      # and PR comments on codecov.io. Without it, this step is skipped.
      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: brylie/LoomDSP
          files: lcov.info
          fail_ci_if_error: false
      # Also after a test failure, so Codecov shows which tests failed.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: brylie/LoomDSP
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true
          fail_ci_if_error: false

  loopback:
    name: Loopback capture (audio QA, Part 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # PipeWire with its ALSA plugin, which is how cpal reaches it. A null
      # sink is the loopback: the test plays into it and captures its
      # monitor (docs/design/audio-qa.md, Part 4).
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pipewire pipewire-alsa pipewire-pulse wireplumber pulseaudio-utils
      - name: Null sink
        run: |
          systemctl --user start pipewire pipewire-pulse wireplumber
          sleep 2
          pactl load-module module-null-sink sink_name=loom_null
          pactl set-default-sink loom_null
          pactl set-default-source loom_null.monitor
      - uses: Swatinem/rust-cache@v2
      # Only the stop that must fade out. Its partner, which checks that a
      # fixed 100 ms stop limit shows as a cut, cannot fail here: the
      # PipeWire ALSA plugin plays out what it was handed after a stream
      # closes, so it never cuts.
      - run: cargo test -p loom-host-desktop -- --ignored --exact device_tests::a_stop_with_large_buffers_fades_out_on_the_device
        env:
          LOOM_LOOPBACK: pipewire

  docs:
    name: Docs (NFR-OSS-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  msrv:
    name: Minimum Rust version (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Library and binary code only: dev-dependencies (benchmarks) may need
      # a newer compiler, and users never build them.
      - run: cargo check --workspace
        env:
          RUSTFLAGS: ""

  wasm:
    name: WebAssembly build (NFR-PORT-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p loom-rt -p loom-core -p loom-modules -p loom-patch

  deny:
    name: Licences and advisories (ADR-0006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1

  # One check to mark as "required" in branch protection, instead of
  # listing every job. Fails if any job above failed or was cancelled.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, coverage, loopback, docs, msrv, wasm, deny, typos]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
