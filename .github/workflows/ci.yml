name: CI

# Every Rust check runs a task from mise.toml, with tools installed by mise
# at the versions mise.toml names. The git hooks (prek.toml) run the same
# tasks, so a push that passes locally passes here. To change a check,
# change its task in mise.toml, not the command here.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches new security advisories and toolchain breakage even
  # when nobody pushes.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail CI. Locally they stay warnings for a fast edit loop, except
  # in the clippy, docs, and wasm tasks, which set them as errors themselves.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Lint groups are configured in the workspace Cargo.toml.
      - run: mise run clippy

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, so this also covers aarch64.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Debug build on purpose: the no-allocation test (NFR-RT-06) is only
      # active with debug assertions.
      - run: mise run test
      - name: Benchmarks compile
        run: cargo bench -p loom-modules --no-run

  # Line coverage. The job fails under LOOM_COVERAGE_MIN percent (mise.toml),
  # the same minimum as the "Restrict code coverage" rule of the main branch
  # ruleset, and is part of "CI success", which the ruleset requires. Reports
  # go to Codecov (coverage and test results) and to GitHub Code Quality.
  # Docs: https://docs.github.com/en/code-security/how-tos/maintain-quality-code/set-up-code-coverage
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload the report to GitHub's code coverage API.
      code-quality: write
      # Find the pull request of a pushed commit.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The PR head commit, not the merge commit, so coverage line
          # numbers match the diff.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Runs the tests once with nextest (its `ci` profile writes a JUnit
      # report for Codecov), writes target/lcov.info and
      # target/cobertura.xml, and fails under LOOM_COVERAGE_MIN. Doc tests
      # are not run here; the Test job runs them.
      - name: Tests with line coverage
        run: mise run coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('target/lcov.info') != '' }}
        run: |
          cargo llvm-cov report --ignore-filename-regex 'device_tests\.rs$' > coverage.txt
          {
            echo '## Test coverage'
            echo
            echo "Minimum line coverage: ${LOOM_COVERAGE_MIN}%"
            echo
            echo '```'
            head -n 3 coverage.txt
            tail -n 1 coverage.txt
            echo '```'
            echo
            echo '<details><summary>Every file</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('target/lcov.info') != '' }}
        with:
          name: coverage
          path: |
            target/lcov.info
            target/cobertura.xml
      # Only this step and the uploads see the Codecov token. The steps
      # above build and run code from the pull request, so the token is not
      # in the job's env. This step only says whether the secret is set.
      - name: Codecov token
        id: codecov
        if: ${{ !cancelled() }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: echo "set=$([ -n "$CODECOV_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Optional: set the CODECOV_TOKEN repository secret to publish reports
      # and PR comments on codecov.io. Without it, this step is skipped.
      - name: Upload to Codecov
        if: ${{ !cancelled() && steps.codecov.outputs.set == 'true' && hashFiles('target/lcov.info') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: brylie/LoomDSP
          files: target/lcov.info
          disable_search: true
          fail_ci_if_error: false
      # Also after a test failure, so Codecov shows which tests failed.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.codecov.outputs.set == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: brylie/LoomDSP
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true
          fail_ci_if_error: false
      # GitHub's own coverage, for the "Restrict code coverage" ruleset rule.
      # Uploads on pushes to main (the baseline) and on pull requests. A pull
      # request from a fork gets a read-only token and cannot upload; see
      # CONTRIBUTING.md, "Coverage and code quality gates".
      - name: Upload coverage to GitHub
        if: >-
          ${{ !cancelled() && hashFiles('target/cobertura.xml') != '' && (
            github.event_name == 'push' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) }}
        uses: actions/upload-code-coverage@v1
        with:
          file: target/cobertura.xml
          language: Rust
          label: code-coverage/llvm-cov
          # Best effort. GitHub Code Quality, and so the coverage API, is
          # only on GitHub Team and Enterprise Cloud plans; elsewhere the
          # upload returns 404. The minimum is enforced by `mise run
          # coverage` above either way, so a failed upload is a warning,
          # not a failed check.
          fail-on-error: false

  loopback:
    name: Loopback capture (audio QA, device capture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # PipeWire with its ALSA plugin, which is how cpal reaches it. A null
      # sink is the loopback: the tests play into it and capture its
      # monitor (docs/design/audio-qa.md, Device capture).
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pipewire pipewire-alsa pipewire-pulse wireplumber pulseaudio-utils
      - name: Null sink
        run: |
          systemctl --user start pipewire pipewire-pulse wireplumber
          sleep 2
          pactl load-module module-null-sink sink_name=loom_null
          pactl set-default-sink loom_null
          pactl set-default-source loom_null.monitor
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # Only the stop that must fade out, and `loom capture` itself. The
      # partner of the stop test, which checks that a fixed 100 ms stop
      # limit shows as a cut, cannot fail here: the PipeWire ALSA plugin
      # plays out what it was handed after a stream closes, so it never
      # cuts. Coverage is measured too: the Coverage job has no device, so
      # the device code is covered only here. `device_tests.rs` is left out,
      # as in the Coverage job (`mise run coverage`).
      - name: Loopback tests, with coverage
        run: >-
          cargo llvm-cov nextest -p loom-host-desktop -p loom-cli --run-ignored only
          -E 'test(=device_tests::a_stop_with_large_buffers_fades_out_on_the_device) | test(=captures_a_loopback_device)'
          --ignore-filename-regex 'device_tests\.rs$'
          --lcov --output-path lcov.info
        env:
          LOOM_LOOPBACK: pipewire
      # Only this step and the uploads see the Codecov token. The steps
      # above build and run code from the pull request, so the token is not
      # in the job's env. This step only says whether the secret is set.
      - name: Codecov token
        id: codecov
        if: ${{ !cancelled() }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: echo "set=$([ -n "$CODECOV_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Codecov merges this report with the Coverage job's. Without the
      # secret (a pull request from a fork), this step is skipped.
      - name: Upload to Codecov
        if: ${{ !cancelled() && steps.codecov.outputs.set == 'true' && hashFiles('lcov.info') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: brylie/LoomDSP
          files: lcov.info
          disable_search: true
          flags: loopback
          fail_ci_if_error: false

  docs:
    name: Docs (NFR-OSS-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: mise run docs

  msrv:
    name: Minimum Rust version (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Warnings are allowed here: a lint added in a newer compiler should
      # not fail the check of an older one.
      - run: mise run msrv
        env:
          RUSTFLAGS: ""

  wasm:
    name: WebAssembly build (NFR-PORT-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run wasm

  deny:
    name: Licences and advisories (ADR-0006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run deny

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run typos

  # One check to mark as "required" in the main branch ruleset, instead of
  # listing every job. Fails if any job above failed or was cancelled.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, coverage, loopback, docs, msrv, wasm, deny, typos]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
