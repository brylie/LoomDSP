# cargo-nextest settings. The coverage task (`mise run coverage`, also run by
# CI's Coverage job and the pre-push hook) runs the tests with nextest so it
# can write a JUnit report for Codecov's test results. The Test job and
# `mise run test` still use plain `cargo test`.

# `--profile ci` writes target/nextest/ci/junit.xml.
[profile.ci]
# Run every test even after one fails, so the report lists all failures.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
