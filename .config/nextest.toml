# Both `mise run test` and `mise run coverage` use nextest. Coverage
# selects the CI profile to write a JUnit report for Codecov.

# `--profile ci` writes target/nextest/ci/junit.xml.
[profile.ci]
# Run every test even after one fails, so the report lists all failures.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
