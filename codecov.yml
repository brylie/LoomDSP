# Codecov settings. Docs: https://docs.codecov.com/docs/codecovyml-reference

codecov:
  notify:
    # Each commit uploads two reports: the Coverage job and the loopback job
    # (flag `loopback`). Wait for both before posting a status, so a status
    # is never judged on half the data.
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: auto
        # Fail only when total coverage falls by more than 5% from the base
        # commit. Timing-dependent tests make small swings normal.
        threshold: 5%
    patch:
      default:
        # The changed lines need 80% coverage, the same minimum as the
        # whole project. A fixed target, not `auto`: Codecov counts moved
        # lines as new, so `auto` failed pure refactors that kept their
        # old coverage.
        target: 80%

comment:
  # Post the PR comment only once both reports are in, like the statuses.
  after_n_builds: 2
