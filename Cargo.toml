[workspace]
resolver = "3"
members = [
    "crates/loom-rt",
    "crates/loom-dsp",
    "crates/loom-core",
    "crates/loom-modules",
    "crates/loom-patch",
    "crates/loom-test",
    "crates/loom-analysis",
    "crates/loom-host-desktop",
    "crates/loom-cli",
    "crates/loom-ui-core",
    "crates/loom-ui",
    "crates/loom-canvas",
    "crates/loom-app",
]
# Fuzz targets need nightly; they have their own workspace (#44).
# `examples/accesskit-macos-repro` is a reproduction for AccessKit upstream.
# `examples/text-font-probe` compares the text crate candidates' fonts
# (plan step 2.4). Both stay out so their dependencies never reach the
# workspace tree.
exclude = ["fuzz", "examples/accesskit-macos-repro", "examples/text-font-probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/brylie/LoomDSP"
authors = ["LoomDSP contributors"]
readme = "README.md"

[workspace.dependencies]
loom-rt = { path = "crates/loom-rt", version = "0.1.0" }
loom-dsp = { path = "crates/loom-dsp", version = "0.1.0" }
loom-core = { path = "crates/loom-core", version = "0.1.0" }
loom-modules = { path = "crates/loom-modules", version = "0.1.0" }
loom-patch = { path = "crates/loom-patch", version = "0.1.0" }
loom-test = { path = "crates/loom-test", version = "0.1.0" }
loom-analysis = { path = "crates/loom-analysis", version = "0.1.0" }
loom-host-desktop = { path = "crates/loom-host-desktop", version = "0.1.0" }
loom-ui-core = { path = "crates/loom-ui-core", version = "0.1.0" }
loom-ui = { path = "crates/loom-ui", version = "0.1.0" }
loom-canvas = { path = "crates/loom-canvas", version = "0.1.0" }

rtrb = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# SPDX licence expressions in patch files (patch-metadata.md, ADR-0023).
spdx = "0.13"
# JSON for `loom-app --dump-ui`.
serde_json = "1"
hound = "3.5"
cpal = "0.18"
midir = "0.11"
clap = { version = "4.6", features = ["derive"] }
rfd = "0.17"
assert_no_alloc = "1.1"
# UI (desktop app only; the engine crates never depend on these).
# Iced and iced_wgpu are upgraded together (OQ-14).
# Iced's defaults minus linux-theme-detection: the app uses its own fixed
# theme, and that feature pulls in mundy and zbus 5 (unmaintained crates).
# Recheck this list when Iced is upgraded.
iced = { version = "0.14", default-features = false, features = [
    "advanced",
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "x11",
    "wayland",
] }
iced_wgpu = "0.14"
# The canvas renderer names wgpu types itself, with no Iced type. This must be
# the wgpu version Iced builds with, so there is one copy, until phase 2
# (docs/dev/leaving-iced-plan.md). No features of our own: Iced turns on what
# the desktop needs.
wgpu = { version = "27", default-features = false }
# The window for loom-ui's shell (docs/dev/leaving-iced-plan.md, step 2.2).
# The one copy Iced uses too, with the window systems it turns on.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland"] }
# Waits for the shell's one GPU adapter request, which wgpu makes async.
pollster = "0.4"
# Builds the app view headlessly in loom-app tests (#189). Same version as Iced.
iced_runtime = "0.14"
bytemuck = { version = "1", features = ["derive"] }
# Text layout for our own UI layer (docs/design/ui-layer.md, section 8,
# rule 8). Pinned: Parley breaks its API about every two months, so it is
# upgraded on purpose, behind our own types.
parley = "=0.12.0"
# Parley's font discovery, named here only to turn on `fontconfig-dlopen`:
# on Linux, fontconfig is loaded when the app runs, not linked when it
# builds, so a build needs no libfontconfig headers and the binary no hard
# link. Same version as Parley's, so Cargo unifies the features.
fontique = { version = "=0.12.0", features = ["fontconfig-dlopen"] }
# Layout for our own UI layer (docs/design/ui-layer.md, decision of
# 2026-11-14): flexbox for rows, columns, and wrapping rows, and a one-cell
# grid for stacks. Only the parts we use; `slotmap` and `smallvec` are
# already in the lock.
taffy = { version = "0.15.1", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree", "content_size"] }
# Glyph rasterising and atlas packing for canvas text. Both already in the
# lock through Iced; listed here so the canvas names its own versions.
swash = "0.2.10"
etagere = "0.2.15"
# PNG files for `loom-app --screenshot`.
png = "0.18"
# Per-user folders for autosave recovery copies (docs/design/autosave.md).
etcetera = "0.11"
# Recovery copy timestamps, shown in local time.
jiff = "0.2"
rustfft = "6.4"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.cargo]
unused_dependencies = "warn"

# Clippy lint groups, set explicitly so the policy is visible and versioned.
# Groups use priority -1 so single lints below can override them.
# Locally these are warnings (fast feedback while editing); CI runs with
# `-D warnings`, so nothing reaches main with a warning.
[workspace.lints.clippy]
# Code that is outright wrong. Always an error, even locally.
correctness = { level = "deny", priority = -1 }
# Code that is very likely wrong or useless.
suspicious = { level = "warn", priority = -1 }
# Code that does something simple in a complex way.
complexity = { level = "warn", priority = -1 }
# Code that could run faster. Matters on the audio thread.
perf = { level = "warn", priority = -1 }
# Code that is not idiomatic Rust.
style = { level = "warn", priority = -1 }
# Cargo.toml hygiene: metadata needed for publishing, no wildcard versions.
cargo = { level = "warn", priority = -1 }
# Duplicate versions come from deep inside third-party crates (cpal, midir),
# where we cannot fix them. `cargo deny check` still reports them.
multiple_crate_versions = "allow"
# Every `unsafe` block needs a `// SAFETY:` comment (AGENTS.md rule 7).
undocumented_unsafe_blocks = "warn"

[profile.release]
debug = 1

[profile.bench]
debug = 1

# Tests render seconds to hours of audio. Optimise the engine crates in
# dev and test builds; `debug_assertions` stay on, so the no-allocation
# tests still run.
[profile.dev.package.loom-core]
opt-level = 3

[profile.dev.package.loom-dsp]
opt-level = 3

[profile.dev.package.loom-modules]
opt-level = 3

[profile.dev.package.loom-test]
opt-level = 3

[profile.dev.package.rtrb]
opt-level = 3
